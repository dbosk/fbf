[tool.poetry]
name = "fbf"
version = "0.1"
description = "Extract detailed data from FeedbackFruits through its Canvas LTI launch"
authors = ["Daniel Bosk <dbosk@kth.se>"]
license = "MIT"
readme = "README.md"
packages = [{include = "fbf", from = "src"}]
include = [
  {path="src/**/*.py", format="wheel"},
  {path="src/**/*.nw", format="sdist"},
  {path="src/**/Makefile", format="sdist"},
  {path="src/**/*.tex", format="sdist"}
]
exclude = [
  {path="src/**/*.py", format="sdist"},
  {path="src/**/*.nw", format="wheel"},
  "*/**/.gitignore",
  "*/**/__pycache__"
]

[tool.poetry.scripts]
fbf = "fbf.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.31"
canvaslms = ">=6.24"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-recording = "^0.14.0"

[tool.pytest.ini_options]
# Replay must never reach the network; a live run or a recording turns the
# block off (see the Testing chapter, src/fbf/testing.nw).
addopts = ["--block-network", "--allowed-hosts=127.0.0.1,::1,localhost"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
